name: Build and Release (Windows Only)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            robot-ui/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install UI Dependencies
        run: |
          cd robot-ui
          npm ci

      - name: Build and Package Electron App
        run: |
          cd robot-ui
          node scripts/gen-icon.mjs
          node scripts/prepare-backend.mjs
          npx electron-vite build
          npx electron-builder --publish never

      # 打包产物里少了 native 模块或资源时，安装包依然会"构建成功"，
      # 用户装上之后才发现后端起不来。这两步就是在 CI 里替用户先装一次、跑一次。
      # 先设成不阻塞（continue-on-error），确认稳定后再改成硬失败。
      - name: Verify packaged tree contains required files
        continue-on-error: true
        shell: pwsh
        run: |
          $root = "release/win-unpacked/resources/backend"
          $required = @(
            "$root/src/index.js",
            "$root/data/models/PP-OCRv6_medium_det.onnx",
            "$root/data/models/PP-OCRv6_medium_rec.onnx",
            "$root/data/models/ppocrv6_dict.txt",
            "$root/ffplay.exe",
            "$root/node_modules/ws",
            "$root/node_modules/onnxruntime-node/bin/napi-v6/win32/x64",
            "$root/node_modules/sharp"
          )
          $missing = @()
          foreach ($p in $required) { if (-not (Test-Path $p)) { $missing += $p } }
          if ($missing.Count -gt 0) {
            Write-Host "缺少以下打包内容:"; $missing | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "打包内容检查通过"

      # 真正的验证：启动打包好的应用，等后端把"就绪"写进 backend.log。
      # 这一行只有在整个模块图（含 onnxruntime-node / sharp 两个 native 模块）
      # 都加载成功时才会出现，所以它能挡住"能装但一起动就崩"的包。
      - name: Smoke test — packaged app must start its backend
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path "release/win-unpacked/robot-live-ui.exe").Path
          Write-Host "exe: $exe"

          # 捕获 Electron 自己的输出：应用如果在 whenReady 之前就崩了，
          # backend.log 根本不会被创建，只有这里能看到原因
          $out = Join-Path $env:RUNNER_TEMP "app-stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "app-stderr.txt"
          $proc = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "started pid=$($proc.Id)"

          # userData 目录名来自 package.json 的 name（robot-live-ui），
          # 不是 productName（机器人直播控制台）——第一版就是写错了这个路径，
          # 导致"应用其实跑得好好的"被误判成"后端起不来"。
          # 这里不写死名字，直接在 APPDATA 下找，改名字也不会失效。
          $log = $null
          $deadline = (Get-Date).AddSeconds(120)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            if (-not $log) {
              $found = Get-ChildItem $env:APPDATA -Recurse -Filter backend.log -Depth 2 -ErrorAction SilentlyContinue |
                       Select-Object -First 1
              if ($found) { $log = $found.FullName; Write-Host "backend.log: $log" }
            }
            if ($log -and (Test-Path $log)) {
              if (Select-String -Path $log -Pattern '控制台通道已就绪' -Quiet -ErrorAction SilentlyContinue) { $ok = $true; break }
              if (Select-String -Path $log -Pattern 'ERR_MODULE_NOT_FOUND|FATAL|process exited with code' -Quiet -ErrorAction SilentlyContinue) { break }
            }
            if ($proc.HasExited) { Write-Host "应用进程已退出，退出码 $($proc.ExitCode)"; break }
            Start-Sleep -Seconds 3
          }

          Write-Host "----- 进程状态 -----"
          Write-Host "HasExited: $($proc.HasExited)"
          if ($proc.HasExited) { Write-Host "ExitCode: $($proc.ExitCode)" }

          Write-Host "----- APPDATA 下实际创建的目录 -----"
          Get-ChildItem $env:APPDATA -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }

          Write-Host "----- 任意位置的 backend.log -----"
          Get-ChildItem $env:APPDATA -Recurse -Filter backend.log -Depth 3 -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "found: $($_.FullName)"; Get-Content $_.FullName }

          foreach ($f in @($out, $err)) {
            if ((Test-Path $f) -and (Get-Item $f).Length -gt 0) {
              Write-Host "----- $(Split-Path $f -Leaf) -----"; Get-Content $f
            }
          }

          Get-Process robot-live-ui -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Write-Host "后端未能在 120 秒内就绪"; exit 1 }
          Write-Host "后端启动成功"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe
