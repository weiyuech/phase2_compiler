<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (Optional - set to none for transparency) -->
  <rect width="1024" height="1024" fill="white" fill-opacity="0.05"/>
  
  <!-- The Antenna -->
  <rect x="497" y="60" width="30" height="120" rx="15" fill="#2c3e50"/>
  <circle cx="512" cy="70" r="40" fill="#2c3e50"/>
  <rect x="432" y="160" width="160" height="40" rx="20" fill="#2c3e50"/>

  <!-- The Main Head (The Marshmallow Shape) -->
  <!-- A 'Super-ellipse' inspired path for smoothness -->
  <path d="M512 200 C250 200 180 280 180 500 C180 720 250 800 512 800 C774 800 844 720 844 500 C844 280 774 200 512 200Z" 
        fill="white" stroke="#2c3e50" stroke-width="35" stroke-linejoin="round"/>
  
  <!-- The Face Screen -->
  <path d="M512 300 C360 300 310 340 310 480 C310 620 360 660 512 660 C664 660 714 620 714 480 C714 340 664 300 512 300Z" 
        fill="#2c3e50"/>
  
  <!-- The Eyes -->
  <circle cx="420" cy="460" r="45" fill="white"/>
  <circle cx="604" cy="460" r="45" fill="white"/>
  
  <!-- The Tiny Smile -->
  <path d="M482 560 Q512 595 542 560" fill="none" stroke="white" stroke-width="15" stroke-linecap="round"/>

  <!-- The Wheels (Chunky & Bold) -->
  <!-- Left Wheel -->
  <rect x="60" y="580" width="200" height="380" rx="100" fill="#34495e" stroke="#2c3e50" stroke-width="10"/>
  <!-- Right Wheel -->
  <rect x="764" y="580" width="200" height="380" rx="100" fill="#34495e" stroke="#2c3e50" stroke-width="10"/>
  
  <!-- Connection to body -->
  <rect x="250" y="700" width="524" height="60" fill="#bdc3c7"/>
</svg>
